services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    # 手元の ./frontend フォルダと、コンテナ内の /app をリンクさせます
    volumes:
      - ./frontend:/app
    # Viteのデフォルトポートを開放します
    ports:
      - "5173:5173"
    # 起動時にパッケージをインストールし、開発サーバーを立ち上げます
    command: sh -c "npm install && npm run dev -- --host"
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true